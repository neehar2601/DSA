site_name: DSA Portal
site_description: >
  A documentation-first DSA learning platform — structured textbook-style,
  with implementations in Python and C for every problem.
site_url: https://neehar2601.github.io/DSA
repo_name: neehar2601/DSA
repo_url: https://github.com/neehar2601/DSA
edit_uri: edit/main/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neehar2601

nav:
  - Home: README.md
  - Foundations:
    - Arrays:
      - Overview: arrays/README.md
      - Easy:
        - LC0001 · Two Sum: arrays/easy/LC0001-two-sum/README.md
    - Strings:
      - Overview: strings/README.md
    - Hashing:
      - Overview: hashing/README.md
    - Recursion:
      - Overview: recursion/README.md
    - Searching:
      - Overview: searching/README.md
    - Sorting:
      - Overview: sorting/README.md
  - Linear Structures:
    - Linked List:
      - Overview: linked-list/README.md
    - Stack:
      - Overview: stack/README.md
    - Queue:
      - Overview: queue/README.md
  - Techniques:
    - Sliding Window:
      - Overview: sliding-window/README.md
    - Two Pointers:
      - Overview: two-pointers/README.md
    - Prefix Sum:
      - Overview: prefix-sum/README.md
  - Trees & Graphs:
    - Trees:
      - Overview: trees/README.md
    - Binary Search Tree:
      - Overview: binary-search-tree/README.md
    - Heap:
      - Overview: heap/README.md
    - Trie:
      - Overview: trie/README.md
    - Graph:
      - Overview: graph/README.md
  - Advanced:
    - Greedy:
      - Overview: greedy/README.md
    - Backtracking:
      - Overview: backtracking/README.md
    - Dynamic Programming:
      - Overview: dynamic-programming/README.md
    - Bit Manipulation:
      - Overview: bit-manipulation/README.md
  - Expert:
    - Segment Tree:
      - Overview: segment-tree/README.md
    - Fenwick Tree:
      - Overview: fenwick-tree/README.md
    - Union Find:
      - Overview: union-find/README.md
